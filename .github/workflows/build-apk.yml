name: Build APK

# Compila el APK de release de Android, firmado con el keystore de Parkit.
#
# Tres formas de correrlo:
#   - `workflow_call` desde release.yml: compila la versión recién publicada y
#     adjunta el APK al GitHub Release.
#   - `pull_request` que toca el propio pipeline: deja el APK como artefacto de
#     la corrida, para probar cambios de build antes de mergear.
#   - `workflow_dispatch`: build manual de cualquier rama, también como artefacto.
#
# `android/` no se versiona: se genera acá con `expo prebuild`.

on:
  workflow_call:
    inputs:
      version:
        description: 'Versión de la app (sin la "v"). Vacío: la de app.json.'
        type: string
        default: ''
      release_tag:
        description: 'Tag del GitHub Release al que se adjunta el APK. Vacío: sólo artefacto.'
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/workflows/release.yml'
      - 'plugins/**'
      - 'app.config.js'
      - 'app.json'

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Van embebidas en el bundle JS: son públicas por diseño.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_OAUTH_REDIRECT_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_OAUTH_REDIRECT_URL }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      APP_VERSION: ${{ inputs.version }}
      # Android exige un versionCode creciente para instalar encima del anterior.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: bun install

      - name: Validar variables de producción
        run: |
          missing=0
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY GOOGLE_MAPS_ANDROID_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta $name (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Preparar keystore de release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64: no se publica un APK firmado con la clave debug."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parkit-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/parkit-release.keystore" >> "$GITHUB_ENV"

      - name: Generar proyecto Android (expo prebuild)
        run: bunx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Sólo ARM: son los celulares reales. x86 es para emuladores y casi
        # duplica el tamaño del APK.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verificar firma y nombrar el APK
        id: apk
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          certs="$("$apksigner" verify --print-certs "$apk")"
          echo "$certs" | grep 'certificate DN'
          if echo "$certs" | grep -q 'CN=Android Debug'; then
            echo "::error::El APK quedó firmado con la clave debug."
            exit 1
          fi
          version="${APP_VERSION:-$(node -p "require('./app.json').expo.version")}"
          name="parkit-${version}.apk"
          if [ -z "$APP_VERSION" ]; then name="parkit-${version}-build${ANDROID_VERSION_CODE}.apk"; fi
          mv "$apk" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Adjuntar APK al GitHub Release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.apk.outputs.name }}
